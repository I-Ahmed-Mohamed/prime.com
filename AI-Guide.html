<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark" data-lang="ar">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>المساعد الذكي | Ahmed Mohamed</title>
    <meta name="theme-color" content="#037eb8" />
    <link href="assets/img/profile/me.jpg" rel="icon" />

    <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,400,600,700,800|Raleway:400,700,800,900|Poppins:300,400,600,700,800,900" rel="stylesheet" />
    <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet" />
    <link href="assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet" />
    <link href="assets/vendor/boxicons/css/boxicons.min.css" rel="stylesheet" />
    
    <link href="assets/css/style.css" rel="stylesheet" />
    <link href="assets/css/modern-enhancements.css" rel="stylesheet" />
    <link href="assets/css/2030-universe.css" rel="stylesheet" />

    <!-- Minimal Base CSS -->
    <style>
      :root {
        --claude-bg: var(--prime-bg, #000000);
        --claude-text: var(--prime-text, #ffffff);
        --claude-surface: var(--prime-surface, rgba(15, 15, 18, 0.72));
        --claude-border: var(--prime-line, rgba(255, 255, 255, 0.1));
        --claude-user-bg: var(--prime-card-strong, rgba(24, 24, 27, 0.86));
        --claude-bot-bg: transparent;
        --claude-font: var(--prime-font, 'Cairo', 'Inter', system-ui, sans-serif);
      }
      
      /* Hide AI Chat button on its own page */
      a[href="AI-Guide.html"].prime-action-btn {
        display: none !important;
      }
      
      body {
        margin: 0;
        padding: 0;
        background-color: var(--claude-bg);
        color: var(--claude-text);
        font-family: var(--claude-font);
        display: flex;
        flex-direction: column;
        height: 100vh;
        overflow: hidden;
      }

      /* Chat Container */
      .claude-chat-container {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
        padding-top: 100px;
        display: flex;
        flex-direction: column;
        align-items: center;
        scroll-behavior: smooth;
      }
      
      .claude-messages-wrapper {
        width: 100%;
        max-width: 768px;
        display: flex;
        flex-direction: column;
        gap: 24px;
        padding-bottom: 20px;
      }

      .claude-msg {
        display: flex;
        gap: 16px;
        width: 100%;
        line-height: 1.6;
        font-size: 16px;
      }

      .claude-msg.user {
        flex-direction: row-reverse;
      }
      .claude-msg.user .msg-content {
        background: var(--claude-user-bg);
        padding: 12px 16px;
        border-radius: 16px;
        border-top-left-radius: 4px;
        max-width: 85%;
      }
      :root[dir="ltr"] .claude-msg.user .msg-content {
        border-top-left-radius: 16px;
        border-top-right-radius: 4px;
      }

      .claude-msg.bot .msg-avatar {
        width: 32px;
        height: 32px;
        border-radius: 6px;
        background: transparent;
        display: grid;
        place-items: center;
        flex-shrink: 0;
      }
      .claude-msg.bot .msg-avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 6px;
      }

      .claude-msg.bot .msg-content {
        padding: 4px 0;
        max-width: 85%;
      }

      /* Input Area */
      .claude-input-container {
        width: 100%;
        padding: 0 20px 24px;
        display: flex;
        justify-content: center;
        background: linear-gradient(to top, var(--claude-bg) 70%, transparent);
      }
      
      .claude-input-wrapper {
        width: 100%;
        max-width: 768px;
        position: relative;
        background: var(--claude-surface);
        border: 1px solid var(--claude-border);
        border-radius: 30px;
        padding: 8px 16px;
        box-shadow: 0 4px 16px rgba(0,0,0,.05);
        display: flex;
        align-items: center;
        gap: 12px;
      }
      
      .claude-input-wrapper textarea {
        flex: 1;
        background: transparent !important;
        border: none !important;
        box-shadow: none !important;
        color: var(--claude-text);
        font-family: inherit;
        font-size: 16px;
        resize: none;
        outline: none;
        max-height: 200px;
        padding: 8px 12px !important;
        margin: 0;
        line-height: 1.5;
        overflow: hidden;
      }
      
      .claude-input-wrapper button {
        margin: 0 !important;
        padding: 0 !important;
        background: linear-gradient(135deg, #00e5ff, #0077ff);
        color: #fff;
        border: none;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        transition: 0.2s;
        flex-shrink: 0;
      }
      .claude-input-wrapper button i {
        font-size: 20px;
      }
      .claude-input-wrapper button:hover {
        opacity: 0.9;
        transform: scale(1.05);
      }
      
      /* Welcome Screen */
      .claude-welcome {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        text-align: center;
        margin-top: 40px;
        margin-bottom: 40px;
      }
      .claude-welcome h1 {
        font-size: 32px;
        font-weight: 700;
        margin-bottom: 24px;
      }
      .claude-prompts {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        justify-content: center;
        max-width: 600px;
      }
      .claude-prompts button {
        background: var(--claude-surface);
        border: 1px solid var(--claude-border);
        color: var(--claude-text);
        padding: 10px 16px;
        border-radius: 12px;
        font-size: 14px;
        cursor: pointer;
        transition: 0.2s;
      }
      .claude-prompts button:hover {
        background: var(--claude-border);
      }
      
      .mobile-chat-nav-btn {
        display: none;
      }
      
      @media (max-width: 680px) {
        /* Hide standard mobile navbar on AI page */
        .prime-mobile-tabs {
          display: none !important;
        }
        
        /* Make the input container act as the bottom bar */
        .claude-input-container {
          position: fixed !important;
          bottom: 0;
          left: 0;
          width: 100%;
          background: var(--prime-surface) !important;
          backdrop-filter: blur(20px);
          -webkit-backdrop-filter: blur(20px);
          border-top: 1px solid var(--prime-line);
          padding: 10px 15px !important;
          display: flex;
          align-items: center;
          gap: 12px;
          z-index: 1000;
        }
        
        .claude-input-wrapper {
          flex: 1;
          margin: 0;
          box-shadow: none !important;
          padding: 6px 12px !important;
          background: transparent !important;
          border: 1px solid var(--prime-line) !important;
        }
        
        /* Show the nav buttons */
        .mobile-chat-nav-btn {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          color: var(--claude-text);
          text-decoration: none;
          flex-shrink: 0;
        }
        .mobile-chat-nav-btn i {
          font-size: 26px;
          color: rgba(255, 255, 255, 0.7);
          transition: 0.2s;
        }
        .mobile-chat-nav-btn:hover i {
          color: #00e5ff;
        }
        .mobile-chat-nav-btn img {
          width: 42px;
          height: 42px;
          border-radius: 50%;
          border: 2px solid #00e5ff;
          object-fit: cover;
        }
      }

      /* Global links inside messages */
      .msg-content a {
        color: #818cf8;
        font-weight: 600;
        text-decoration: none;
      }
      .msg-content a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <!-- Navbar Container -->
    <div id="navbar-container"></div>

    <div class="claude-chat-container" id="chatContainer">
      <div class="claude-messages-wrapper" id="messagesWrapper">
        <div class="claude-welcome" id="welcomeScreen">
          <h1>مرحباً، أنا المساعد الذكي لأحمد.</h1>
          <div class="claude-prompts">
            <button data-ai-prompt="عاوز موقع تعريفي">موقع تعريفي</button>
            <button data-ai-prompt="تفاصيل خدمة إدارة الصفحات">إدارة الصفحات</button>
            <button data-ai-prompt="عاوز فيديو بالذكاء الاصطناعي">فيديو AI</button>
            <button data-ai-prompt="أسعار خدماتك ايه؟">الأسعار</button>
          </div>
        </div>
      </div>
    </div>

    <div class="claude-input-container">
      <form class="claude-input-wrapper" id="chatForm">
        <textarea id="chatInput" rows="1" placeholder="اكتب رسالتك هنا..."></textarea>
        <button type="submit" aria-label="Send"><i class="bi bi-arrow-up"></i></button>
      </form>
      
      <!-- Profile Button (Mobile Only) -->
      <a href="javascript:void(0)" class="mobile-chat-nav-btn" id="open-profile-menu-ai" title="البروفايل">
        <img src="assets/img/profile/me.jpg" alt="Profile" />
      </a>
    </div>

    <script src="assets/js/navbar.js"></script>
    <script src="assets/js/2030-universe.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const aiProfileBtn = document.getElementById('open-profile-menu-ai');
        if (aiProfileBtn) {
          aiProfileBtn.addEventListener('click', (e) => {
            e.preventDefault();
            const originalProfileBtn = document.querySelector('.prime-mobile-tabs #open-profile-menu') || document.querySelector('#open-profile-menu');
            if (originalProfileBtn) originalProfileBtn.click();
          });
        }
      });
      
      (function () {
        // AI Chat Logic
        const persona = {
          phone1: '01094547599',
          phone2: '01044599911',
          email: 'ahmedcodteng@gmail.com',
          facebook: 'https://www.facebook.com/share/1HmBiCLjYj/?mibextid=wwXIfr',
          tiktok: 'https://www.tiktok.com/@ahmadmoamedw.s?_r=1&_t=ZS-9AdH4YFiKKS',
          services: 'تصميم وبناء مواقع للشركات، إدارة صفحات السوشيال ميديا، فيديوهات AI، وبرمجة تطبيقات خاصة',
          stack: 'Full Stack .NET, Angular, HTML, CSS, JavaScript, TypeScript, SQL Server, Entity Framework, Bootstrap'
        };
        
        const messagesWrapper = document.getElementById('messagesWrapper');
        const input = document.getElementById('chatInput');
        const form = document.getElementById('chatForm');
        const welcomeScreen = document.getElementById('welcomeScreen');
        const chatContainer = document.getElementById('chatContainer');
        
        let isFirstMessage = true;

        const addMessage = (html, type='bot') => {
          if (isFirstMessage) {
            welcomeScreen.style.display = 'none';
            isFirstMessage = false;
          }

          const div = document.createElement('div');
          div.className = 'claude-msg ' + type;
          
          if (type === 'bot') {
            div.innerHTML = `
              <div class="msg-avatar"><img src="assets/img/profile/me.jpg" alt="AI"></div>
              <div class="msg-content">${html}</div>
            `;
          } else {
            div.innerHTML = `<div class="msg-content">${html}</div>`;
          }
          
          messagesWrapper.appendChild(div);
          chatContainer.scrollTop = chatContainer.scrollHeight;
          return div.querySelector('.msg-content');
        };
        
        const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        
        function reply(q) {
          const t = q.toLowerCase();
          const contact = `<br><br><b>للتواصل المباشر:</b><br><a href="tel:+2${persona.phone1}">${persona.phone1}</a> - <a href="tel:+2${persona.phone2}">${persona.phone2}</a>`;
          
          // التحيات
          if (/أهلا|مرحبا|سلام|عامل ايه|ازيك|hi|hello|hey/.test(t)) return `أهلاً بك يا فندم! 😊 أنا المساعد الذكي الخاص بالمهندس أحمد محمد. إزاي أقدر أساعدك النهاردة؟`;
          if (/صباح|مساء/.test(t)) return `يا هلا بيك! أتمنى لك يوم سعيد. إزاي أقدر أساعدك في مشاريعك أو تصاميمك؟`;
          
          // الهوية
          if (/مين انت|اسمك ايه|مين احمد|عن احمد|who are you/.test(t)) return `أنا المساعد الذكي الخاص بالمهندس أحمد محمد. أحمد هو مهندس برمجيات ومطور ويب (Frontend & Backend) ومصمم محترف بيقدم حلول تقنية متكاملة.`;
          
          // الخدمات الأساسية
          if (/موقع|ويب|website|site|landing|تعريفي|متجر/.test(t)) return `أحمد خبير في تصميم وبرمجة المواقع والمتاجر الإلكترونية لتكون سريعة، جذابة، ومتجاوبة مع كل الشاشات باستخدام أحدث التقنيات. <a href="Services.html">تصفح الخدمات</a>${contact}`;
          if (/تصميم|سوشيال|صفحات|سوشيال ميديا|إدارة صفحات|لوجو|هوية|photoshop|brand/.test(t)) return `بنقدم خدمة إدارة كاملة للسوشيال ميديا: تصاميم احترافية (بوستات، لوجو، هوية بصرية)، وكتابة محتوى، لزيادة تفاعل عملائك. <a href="Designs.html">تصفح التصميمات</a>${contact}`;
          if (/فيديو|ريلز|reel|ai|ذكاء|مونتاج|موشن|motion/.test(t)) return `نقدر نصمم فيديوهات ريلز وإعلانات احترافية جداً بالموشن جرافيك والذكاء الاصطناعي عشان تلفت انتباه أي عميل! <a href="Videos.html">شاهد الفيديوهات</a>${contact}`;
          
          // المهارات التقنية
          if (/مهارات|تقنيات|برمجة|لغات|angular|dotnet|\.net|sql|backend|frontend|react|node|javascript/.test(t)) return `أحمد بيشتغل بـتقنيات قوية جداً زي: ${persona.stack}. يقدر يبني واجهات أمامية (Frontend) وأنظمة إدارة خلفية (Backend) متكاملة. <a href="Skills.html">تصفح المهارات كاملة</a>`;
          
          // الأعمال السابقة
          if (/مشاريع|portfolio|project|اعمال|أعمال|شغل|سابقة/.test(t)) return `أكيد! تقدر تشوف مجموعة من أقوى المواقع والأنظمة اللي أحمد برمجها من هنا: <a href="Projects.html">تصفح المشاريع</a>`;
          
          // الأسعار
          if (/سعر|تكلفة|كام|بكام|price|cost|فلوس/.test(t)) return `الأسعار ممتازة وبتتحدد حسب تفاصيل طلبك. كمثال مبدئي: الموقع التعريفي يبدأ من 5000 جنيه، وباقات إدارة السوشيال ميديا تبدأ من 2000 جنيه. كلمنا عشان نظبطلك عرض سعر مخصوص! ${contact}`;
          
          // التواصل
          if (/فيس|فيسبوك|facebook|تيك|تيكتوك|تيك توك|tiktok|سوشيال/.test(t)) return `تقدر تتابع المهندس أحمد على حساباته الرسمية:<br>🔹 <a href="${persona.facebook}" target="_blank">صفحة Facebook</a><br>🔹 <a href="${persona.tiktok}" target="_blank">حساب TikTok</a><br>🔹 واتساب: <a href="https://wa.me/2${persona.phone1}">${persona.phone1}</a>`;
          if (/تواصل|رقم|واتساب|واتس|تليفون|call|phone|contact|whatsapp/.test(t)) return `تقدر تتواصل مع أحمد مباشرة في أي وقت (مكالمة أو واتساب) على الأرقام دي:<br><a href="tel:+2${persona.phone1}">${persona.phone1}</a><br><a href="tel:+2${persona.phone2}">${persona.phone2}</a>`;
          
          // المحادثة العامة
          if (/شكرا|تسلم|حبيبي|باي|مع السلامة|thanks/.test(t)) return `العفو يا فندم! أنا موجود هنا في أي وقت تحتاجني فيه. يومك جميل! 🌟`;
          if (/بتحب|رأيك|كيف|ازاي/.test(t)) return `أنا مجرد مساعد ذكي مبرمج لمساعدتك للوصول لأفضل خدمات الويب والتصميم من المهندس أحمد. سيبك مني وخلينا نتكلم عن مشروعك! 😉`;
          
          // الرد الافتراضي الذكي
          return `سؤال ممتاز! عشان أقدر أفيدك أكتر بخصوص "${esc(t.substring(0, 30))}..." ياريت تتواصل مع المهندس أحمد مباشرة عشان يدرس فكرتك ويديلك الحل التقني المظبوط.${contact}`;
        }
        
        function ask(q) {
          const text = (q || '').trim();
          if (!text) return;
          addMessage(esc(text), 'user');
          
          // Typing Indicator
          const msgContent = addMessage('<span style="opacity: 0.7;">جاري الكتابة... ⏳</span>', 'bot');
          
          // Simulated Delay based on text length for realism
          setTimeout(() => {
             const answer = reply(text);
             msgContent.innerHTML = answer;
             chatContainer.scrollTop = chatContainer.scrollHeight;
          }, 800 + Math.random() * 500);
        }
        
        form.addEventListener('submit', e => { 
          e.preventDefault(); 
          ask(input.value); 
          input.value = ''; 
          input.style.height = 'auto'; 
        });
        
        input.addEventListener('input', () => { 
          input.style.height = 'auto'; 
          input.style.height = Math.min(input.scrollHeight, 150) + 'px'; 
        });

        // Allow Shift+Enter for newline, Enter for submit
        input.addEventListener('keydown', e => {
          if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            form.dispatchEvent(new Event('submit'));
          }
        });
        
        document.querySelectorAll('[data-ai-prompt]').forEach(btn => btn.addEventListener('click', () => ask(btn.dataset.aiPrompt)));
        
        // Check URL for direct questions
        const urlQ = new URLSearchParams(location.search).get('q');
        if (urlQ) setTimeout(() => ask(urlQ), 300);

      })();
    </script>
  </body>
</html>
